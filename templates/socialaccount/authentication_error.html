{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="p-5 bg-white shadow rounded-4">
                <i class="bi bi-exclamation-triangle text-danger display-1"></i>
                <h2 class="fw-bold mt-4">登录遇到问题</h2>
                <p class="text-muted mb-4">第三方账号验证失败。可能是因为您取消了授权，或者系统配置有误。</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'account_login' %}" class="btn btn-primary">返回重新登录</a>
                    <a href="/" class="btn btn-outline-secondary">回到首页</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
