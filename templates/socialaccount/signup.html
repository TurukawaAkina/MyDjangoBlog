{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <h3 class="fw-bold mb-3">最后一步</h3>
                    <p class="text-muted">您正尝试使用第三方账号登录。请确认您的基本信息：</p>
                    
                    <form id="signup_form" method="post" action="{% url 'socialaccount_signup' %}">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3 text-start">
                                <label class="form-label small fw-bold">{{ field.label }}</label>
                                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" 
                                       class="form-control" value="{{ field.value|default:'' }}" required>
                                {% if field.errors %}
                                    <div class="text-danger small">{{ field.errors.0 }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <div class="d-grid mt-4">
                            <button class="btn btn-primary btn-lg shadow-sm" type="submit">确认注册并登录</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
